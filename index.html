<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>نظام حضور الطلاب QR</title>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root{
  font-family:Arial,Tahoma,sans-serif;
  color:#17365d;
  background:#f4f6f9;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#f7fbff,#eef3f8);
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1,h2{
  margin-top:0;
}

h1{
  text-align:center;
  font-size:28px;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,select,button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #ccd6e0;
  font-size:17px;
}

button{
  background:#17365d;
  color:#fff;
  border:none;
  cursor:pointer;
  font-weight:bold;
  margin-top:14px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

button.secondary{
  background:#6b7280;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.small{
  font-size:13px;
}

.muted{
  color:#5c6b7a;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:18px;
  margin-top:10px;
}

.status{
  padding:14px;
  border-radius:14px;
  margin-top:12px;
  font-weight:bold;
}

.ok{
  background:#e8f7ed;
  color:#176b35;
}

.warn{
  background:#fff4dd;
  color:#875f00;
}

.err{
  background:#fdeaea;
  color:#9a1d1d;
}

.hidden{
  display:none!important;
}

.last{
  font-size:20px;
}

@media(max-width:600px){
  .wrap{
    padding:10px;
  }

  .card{
    padding:15px;
  }

  .top{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>نظام حضور الطلاب بالـ QR</h1>

    <div class="muted" style="text-align:center">
      المسح من كاميرا الموبايل → تسجيل تلقائي في Google Sheets
    </div>

  </div>


  <!-- LOGIN -->

  <div id="loginCard" class="card">

    <h2>دخول المشرف</h2>

    <label for="supervisor">
      اسم المشرف
    </label>

    <select id="supervisor">

      <option value="">
        جارٍ تحميل المشرفين...
      </option>

    </select>


    <label for="code">
      كلمة السر
    </label>

    <input
      id="code"
      type="password"
      inputmode="numeric"
      autocomplete="current-password"
      placeholder="أدخل كلمة السر"
    >


    <button id="loginBtn">
      دخول وبدء المسح
    </button>


    <div
      id="loginStatus"
      class="status hidden"
    ></div>

  </div>


  <!-- SCANNER -->

  <div
    id="scannerCard"
    class="hidden"
  >

    <div class="card">

      <div class="top">

        <div>

          <div class="small muted">
            المشرف
          </div>

          <div
            id="loggedSupervisor"
            style="font-weight:bold;font-size:20px"
          ></div>

        </div>


        <button
          id="logoutBtn"
          class="secondary"
          style="width:auto;margin:0;padding:10px 15px"
        >
          خروج
        </button>

      </div>


      <div style="margin-top:15px">

        <div class="small muted">
          الجلسة الحالية
        </div>

        <div
          id="sessionInfo"
          style="font-weight:bold;font-size:20px"
        >
          لا توجد جلسة
        </div>

      </div>

    </div>


    <div class="card">

      <h2>
        امسح QR الطالب
      </h2>

      <div id="reader"></div>

      <div
        id="scanStatus"
        class="status warn"
      >
        وجّه الكاميرا إلى QR الموجود على كارنيه الطالب.
      </div>

    </div>


    <div class="card">

      <div class="small muted">
        آخر عملية
      </div>

      <div
        id="lastResult"
        class="last"
      >
        —
      </div>

      <div
        id="presentCount"
        class="small muted"
        style="margin-top:8px"
      ></div>

    </div>

  </div>

</div>


<script>

/* ==================================================
   GOOGLE APPS SCRIPT
================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbxPQj65-wjluoAxGRkL4w40Uw0fKt_5fJWMTo5MrisBUwhfh-44yNk9dnkaoQcO6meP/exec';


let token = '';
let scanner = null;
let scannerRunning = false;
let processing = false;


const $ = id => document.getElementById(id);


/* ==================================================
   STATUS
================================================== */

function setStatus(el,text,cls){

  if(!el) return;

  el.textContent = text;

  el.className =
    'status ' + cls;
}


/* ==================================================
   JSONP
================================================== */

function api(action,params={}){

  return new Promise((resolve,reject)=>{

    const callbackName =
      'qrCallback_' +
      Date.now() +
      '_' +
      Math.floor(Math.random()*1000000);


    const script =
      document.createElement('script');


    let finished = false;


    function cleanup(){

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }

      try{
        delete window[callbackName];
      }catch(e){
        window[callbackName] = undefined;
      }

    }


    function finishSuccess(data){

      if(finished) return;

      finished = true;

      clearTimeout(timer);

      cleanup();

      resolve(data);

    }


    function finishError(message){

      if(finished) return;

      finished = true;

      clearTimeout(timer);

      cleanup();

      reject(
        new Error(message)
      );

    }


    window[callbackName] =
      function(data){

        finishSuccess(data);

      };


    script.onerror =
      function(){

        finishError(
          'تعذر الاتصال بخادم Google Apps Script.'
        );

      };


    const query =
      new URLSearchParams();


    query.set(
      'action',
      String(action)
    );


    query.set(
      'callback',
      callbackName
    );


    Object.keys(params).forEach(
      function(key){

        const value =
          params[key];

        if(
          value !== undefined &&
          value !== null
        ){

          query.set(
            key,
            String(value)
          );

        }

      }
    );


    const timer =
      setTimeout(
        function(){

          finishError(
            'انتهت مهلة الاتصال بخادم Google Apps Script.'
          );

        },
        20000
      );


    script.src =
      API_URL +
      '?' +
      query.toString();


    document.body.appendChild(script);

  });

}


/* ==================================================
   LOAD CONFIG
================================================== */

async function loadConfig(){

  setStatus(
    $('loginStatus'),
    'جاري الاتصال بخادم Google Apps Script...',
    'warn'
  );

  $('loginStatus')
    .classList
    .remove('hidden');


  try{

    const res =
      await api('config');


    console.log(
      'CONFIG RESPONSE:',
      res
    );


    if(
      !res ||
      !res.ok
    ){

      throw new Error(
        res?.message ||
        'تعذر تحميل إعدادات النظام.'
      );

    }


    const select =
      $('supervisor');


    select.innerHTML =
      '<option value="">اختر المشرف</option>';


    const supervisors =
      res.supervisors || [];


    supervisors.forEach(
      function(item){

        const name =
          typeof item === 'string'
            ? item
            : item.name;


        if(!name) return;


        const option =
          document.createElement('option');


        option.value =
          name;


        option.textContent =
          name;


        select.appendChild(
          option
        );

      }
    );


    if(!supervisors.length){

      setStatus(
        $('loginStatus'),
        'لم يتم العثور على المشرفين في شيت Supervisors.',
        'err'
      );

      return;

    }


    setStatus(
      $('loginStatus'),
      'تم الاتصال بالخادم. اختر المشرف وسجل الدخول.',
      'ok'
    );


  }catch(err){

    console.error(
      'CONFIG ERROR:',
      err
    );


    setStatus(
      $('loginStatus'),
      err.message ||
      'تعذر الاتصال بخادم Google Apps Script.',
      'err'
    );

  }

}


/* ==================================================
   LOGIN
================================================== */

async function login(){

  const supervisor =
    $('supervisor').value;


  const code =
    $('code').value.trim();


  if(
    !supervisor ||
    !code
  ){

    setStatus(
      $('loginStatus'),
      'اختر اسم المشرف واكتب كلمة السر.',
      'err'
    );

    $('loginStatus')
      .classList
      .remove('hidden');

    return;

  }


  $('loginBtn').disabled =
    true;


  setStatus(
    $('loginStatus'),
    'جاري تسجيل الدخول...',
    'warn'
  );


  $('loginStatus')
    .classList
    .remove('hidden');


  try{

    const res =
      await api(
        'login',
        {
          supervisor:supervisor,
          code:code
        }
      );


    console.log(
      'LOGIN RESPONSE:',
      res
    );


    if(
      !res ||
      !res.ok
    ){

      throw new Error(
        res?.message ||
        'فشل تسجيل الدخول.'
      );

    }


    token =
      res.token;


    $('loggedSupervisor')
      .textContent =
      res.supervisor ||
      supervisor;


    $('loginCard')
      .classList
      .add('hidden');


    $('scannerCard')
      .classList
      .remove('hidden');


    $('loginStatus')
      .classList
      .add('hidden');


    updateSessionInfo(
      res.session
    );


    await startScanner();


  }catch(err){

    console.error(
      'LOGIN ERROR:',
      err
    );


    setStatus(
      $('loginStatus'),
      err.message ||
      'فشل تسجيل الدخول.',
      'err'
    );


    $('loginStatus')
      .classList
      .remove('hidden');


  }finally{

    $('loginBtn').disabled =
      false;

  }

}


/* ==================================================
   SESSION
================================================== */

function updateSessionInfo(session){

  if(!session){

    $('sessionInfo')
      .textContent =
      'لا توجد جلسة مفتوحة حاليًا';

    return;

  }


  $('sessionInfo')
    .textContent =
    session.name +
    ' — ' +
    session.level;

}


/* ==================================================
   CAMERA
================================================== */

async function startScanner(){

  if(scannerRunning){
    return;
  }


  if(scanner){

    try{
      await scanner.clear();
    }catch(e){}

    scanner = null;

  }


  scanner =
    new Html5Qrcode(
      'reader'
    );


  const config = {

    fps:10,

    qrbox:{
      width:260,
      height:260
    },

    aspectRatio:1.0,

    rememberLastUsedCamera:true

  };


  try{

    await scanner.start(

      {
        facingMode:{
          ideal:'environment'
        }
      },

      config,

      onScanSuccess,

      function(){}

    );


    scannerRunning =
      true;


    setStatus(
      $('scanStatus'),
      'الكاميرا تعمل — وجّهها إلى QR الطالب.',
      'ok'
    );


  }catch(firstErr){

    console.error(
      'Camera first attempt:',
      firstErr
    );


    try{

      const cameras =
        await Html5Qrcode.getCameras();


      if(
        !cameras ||
        !cameras.length
      ){

        throw firstErr;

      }


      await scanner.start(

        cameras[0].id,

        config,

        onScanSuccess,

        function(){}

      );


      scannerRunning =
        true;


      setStatus(
        $('scanStatus'),
        'الكاميرا تعمل — وجّهها إلى QR الطالب.',
        'ok'
      );


    }catch(err){

      console.error(
        'Camera final error:',
        err
      );


      setStatus(
        $('scanStatus'),
        'تعذر تشغيل الكاميرا. افتح الموقع من HTTPS واسمح باستخدام الكاميرا.',
        'err'
      );

    }

  }

}


/* ==================================================
   STOP CAMERA
================================================== */

async function stopScanner(){

  if(
    !scanner ||
    !scannerRunning
  ){

    scanner = null;

    scannerRunning =
      false;

    return;

  }


  try{

    await scanner.stop();

  }catch(e){}


  try{

    scanner.clear();

  }catch(e){}


  scanner = null;

  scannerRunning =
    false;

}


/* ==================================================
   SCAN
================================================== */

async function onScanSuccess(decodedText){

  if(processing){
    return;
  }


  if(!token){

    setStatus(
      $('scanStatus'),
      'جلسة الدخول غير موجودة. سجل الدخول مرة أخرى.',
      'err'
    );

    return;

  }


  processing =
    true;


  setStatus(
    $('scanStatus'),
    'تمت قراءة QR — جاري تسجيل الحضور...',
    'warn'
  );


  try{

    const res =
      await api(
        'scan',
        {
          token:token,
          qr:decodedText
        }
      );


    console.log(
      'SCAN RESPONSE:',
      res
    );


    if(!res){

      throw new Error(
        'لم يصل رد من الخادم.'
      );

    }


    if(
      res.code ===
      'AUTH_EXPIRED'
    ){

      throw new Error(
        'انتهت جلسة الدخول.'
      );

    }


    if(
      res.ok &&
      res.code === 'PRESENT'
    ){

      $('lastResult')
        .textContent =
        '✅ ' +
        res.student.name +
        ' — تم تسجيل الحضور';


      $('presentCount')
        .textContent =
        'إجمالي الحاضرين في الجلسة: ' +
        res.presentCount;


      setStatus(
        $('scanStatus'),
        'تم تسجيل: ' +
        res.student.name +
        ' — ' +
        res.student.id,
        'ok'
      );


    }else if(
      res.code ===
      'DUPLICATE'
    ){

      $('lastResult')
        .textContent =
        '⚠️ ' +
        (res.student?.name || '') +
        ' — الطالب مسجل بالفعل';


      setStatus(
        $('scanStatus'),
        'هذا الطالب مسجل بالفعل في نفس الجلسة.',
        'warn'
      );


    }else if(
      res.code ===
      'LEVEL_MISMATCH'
    ){

      $('lastResult')
        .textContent =
        '⚠️ ' +
        (res.student?.name || '') +
        ' — المستوى غير مطابق';


      setStatus(
        $('scanStatus'),
        res.message ||
        'المستوى غير مطابق.',
        'warn'
      );


    }else{

      $('lastResult')
        .textContent =
        '❌ ' +
        (
          res.message ||
          'لم يتم التسجيل'
        );


      setStatus(
        $('scanStatus'),
        res.message ||
        'لم يتم التسجيل',
        'err'
      );

    }


  }catch(err){

    console.error(
      'SCAN ERROR:',
      err
    );


    $('lastResult')
      .textContent =
      '❌ ' +
      (
        err.message ||
        'حدث خطأ'
      );


    setStatus(
      $('scanStatus'),
      err.message ||
      'حدث خطأ أثناء تسجيل الحضور.',
      'err'
    );


    if(
      err.message &&
      err.message.includes(
        'انتهت جلسة الدخول'
      )
    ){

      await logout();

      return;

    }

  }finally{

    setTimeout(
      function(){

        processing =
          false;


        if(scannerRunning){

          setStatus(
            $('scanStatus'),
            'جاهز لمسح الطالب التالي.',
            'ok'
          );

        }

      },
      1200
    );

  }

}


/* ==================================================
   LOGOUT
================================================== */

async function logout(){

  await stopScanner();


  if(token){

    try{

      await api(
        'logout',
        {
          token:token
        }
      );

    }catch(e){

      console.error(
        'LOGOUT ERROR:',
        e
      );

    }

  }


  token = '';


  $('code').value = '';


  $('scannerCard')
    .classList
    .add('hidden');


  $('loginCard')
    .classList
    .remove('hidden');


  setStatus(
    $('loginStatus'),
    'تم تسجيل الخروج.',
    'ok'
  );


  $('loginStatus')
    .classList
    .remove('hidden');

}


/* ==================================================
   EVENTS
================================================== */

$('loginBtn')
  .addEventListener(
    'click',
    login
  );


$('logoutBtn')
  .addEventListener(
    'click',
    logout
  );


$('code')
  .addEventListener(
    'keydown',
    function(e){

      if(
        e.key === 'Enter'
      ){

        login();

      }

    }
  );


/* ==================================================
   START
================================================== */

window.addEventListener(
  'DOMContentLoaded',
  function(){

    loadConfig();

  }
);

</script>

</body>
</html>
