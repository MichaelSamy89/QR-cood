<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نظام حضور الطلاب QR</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{font-family:Arial,Tahoma,sans-serif;color:#17365d;background:#f4f6f9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f7fbff,#eef3f8)}
    .wrap{max-width:760px;margin:auto;padding:18px}
    .card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 10px 30px rgba(0,0,0,.08)}
    h1,h2{margin-top:0}
    h1{text-align:center;font-size:28px}
    label{display:block;font-weight:bold;margin:12px 0 6px}
    input,select,button{width:100%;padding:14px;border-radius:12px;border:1px solid #ccd6e0;font-size:17px}
    button{background:#17365d;color:#fff;border:none;cursor:pointer;font-weight:bold;margin-top:14px}
    button.secondary{background:#6b7280}
    button.danger{background:#a22}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .badge{padding:8px 12px;border-radius:999px;background:#eef3f8;font-weight:bold}
    #reader{width:100%;overflow:hidden;border-radius:18px;margin-top:10px}
    .status{padding:14px;border-radius:14px;margin-top:12px;font-weight:bold}
    .ok{background:#e8f7ed;color:#176b35}
    .warn{background:#fff4dd;color:#875f00}
    .err{background:#fdeaea;color:#9a1d1d}
    .muted{color:#5c6b7a}
    .hidden{display:none!important}
    .last{font-size:20px}
    .small{font-size:13px}
    @media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:15px}}
  </style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>نظام حضور الطلاب بالـ QR</h1>
    <div class="muted" style="text-align:center">
      المسح من كاميرا الموبايل → تسجيل تلقائي في Google Sheets
    </div>
  </div>

  <div id="loginCard" class="card">
    <h2>دخول المشرف</h2>

    <label for="supervisor">اسم المشرف</label>
    <select id="supervisor">
      <option value="">جارٍ تحميل المشرفين...</option>
    </select>

    <label for="code">كلمة السر</label>
    <input id="code" type="password" inputmode="numeric" autocomplete="current-password" placeholder="أدخل كلمة السر">

    <button id="loginBtn">دخول وبدء المسح</button>

    <div id="loginStatus" class="status hidden"></div>
  </div>

  <div id="scannerCard" class="hidden">

    <div class="card">
      <div class="top">
        <div>
          <div class="small muted">المشرف</div>
          <div id="loggedSupervisor" style="font-weight:bold;font-size:20px"></div>
        </div>
        <button id="logoutBtn" class="secondary" style="width:auto;margin:0;padding:10px 15px">خروج</button>
      </div>

      <div style="margin-top:15px">
        <div class="small muted">الجلسة الحالية</div>
        <div id="sessionInfo" style="font-weight:bold;font-size:20px">لا توجد جلسة</div>
      </div>
    </div>

    <div class="card">
      <h2>امسح QR الطالب</h2>
      <div id="reader"></div>
      <div id="scanStatus" class="status warn">وجّه الكاميرا إلى QR الموجود على كارنيه الطالب.</div>
    </div>

    <div class="card">
      <div class="small muted">آخر عملية</div>
      <div id="lastResult" class="last">—</div>
      <div id="presentCount" class="small muted" style="margin-top:8px"></div>
    </div>

  </div>
</div>

<script>
  /************************************************************
   * مهم جدًا:
   * بعد نشر Apps Script كـ Web App، ضع رابط /exec هنا.
   * مثال:
   * const API_URL = 'https://script.google.com/macros/s/XXXXXXXX/exec';
   ************************************************************/
const API_URL = 'https://script.google.com/macros/s/AKfycbxPQj65-wjluoAxGRkL4w40Uw0fKt_5fJWMTo5MrisBUwhfh-44yNk9dnkaoQcO6meP/exec';
  let pending = [];
  let bridgeReady = false;

  let token = '';
  let scanner = null;
  let scannerRunning = false;
  let processing = false;

  const $ = id => document.getElementById(id);

  function setStatus(el, text, cls) {
    el.textContent = text;
    el.className = 'status ' + cls;
  }

  function initBridge() {
  if (!API_URL || API_URL.includes('ضع_هنا')) {
    throw new Error('رابط Apps Script غير موجود داخل API_URL');
  }

  let frame = document.getElementById('bridgeFrame');

  // لو العنصر غير موجود، أنشئه تلقائيًا
  if (!frame) {
    frame = document.createElement('iframe');

    frame.id = 'bridgeFrame';
    frame.title = 'Google Apps Script Bridge';

    frame.style.position = 'absolute';
    frame.style.width = '1px';
    frame.style.height = '1px';
    frame.style.left = '-9999px';
    frame.style.top = '-9999px';
    frame.style.border = '0';
    frame.style.visibility = 'hidden';

    document.body.appendChild(frame);
  }

  frame.src = API_URL + '?bridge=1';

  return frame;
}

  window.addEventListener('message', event => {
    const msg = event.data || {};
    if (msg.source !== 'QR_ATTENDANCE_BRIDGE') return;

    if (msg.type === 'READY') {
      bridgeReady = true;
      loadConfig();
      return;
    }

    const item = pending.shift();
    if (!item) return;

    if (msg.type === 'RESULT') item.resolve(msg.data);
    else item.reject(new Error(msg.data?.message || 'حدث خطأ في الاتصال.'));
  });

  function initBridge() {
    if (!API_URL || API_URL.includes('ضع_هنا_رابط')) {
      setStatus($('loginStatus'), 'ضع رابط Apps Script /exec داخل API_URL في index.html.', 'err');
      $('loginStatus').classList.remove('hidden');
      return;
    }
    document.getElementById('bridgeFrame').src = API_URL + '?bridge=1';
  }

  async function loadConfig() {
    try {
      const res = await bridgeRequest('bridgeConfig');
      if (!res.ok) throw new Error(res.message || 'تعذر تحميل الإعدادات');

      $('supervisor').innerHTML = '<option value="">اختر المشرف</option>';
      res.supervisors.forEach(name => {
        const op = document.createElement('option');
        op.value = name;
        op.textContent = name;
        $('supervisor').appendChild(op);
      });
    } catch (err) {
      setStatus($('loginStatus'), err.message, 'err');
      $('loginStatus').classList.remove('hidden');
    }
  }

  async function login() {
    const supervisor = $('supervisor').value;
    const code = $('code').value.trim();

    if (!supervisor || !code) {
      setStatus($('loginStatus'), 'اختر اسم المشرف واكتب كلمة السر.', 'err');
      $('loginStatus').classList.remove('hidden');
      return;
    }

    $('loginBtn').disabled = true;
    setStatus($('loginStatus'), 'جاري تسجيل الدخول...', 'warn');
    $('loginStatus').classList.remove('hidden');

    try {
      const res = await bridgeRequest('bridgeLogin', {supervisor: supervisor, code: code});

      if (!res.ok) {
        throw new Error(res.message || 'فشل تسجيل الدخول');
      }

      token = res.token;
      $('loggedSupervisor').textContent = res.supervisor;
      $('loginCard').classList.add('hidden');
      $('scannerCard').classList.remove('hidden');
      $('loginStatus').classList.add('hidden');

      updateSessionInfo(res.session);
      await startScanner();

    } catch (err) {
      setStatus($('loginStatus'), err.message, 'err');
      $('loginStatus').classList.remove('hidden');
    } finally {
      $('loginBtn').disabled = false;
    }
  }

  function updateSessionInfo(session) {
    if (!session) {
      $('sessionInfo').textContent = 'لا توجد جلسة مفتوحة حاليًا';
      return;
    }
    $('sessionInfo').textContent =
      session.name + ' — ' + session.level;
  }

  async function startScanner() {
    if (scannerRunning) return;

    scanner = new Html5Qrcode('reader');

    const config = {
      fps: 12,
      qrbox: {width: 260, height: 260},
      aspectRatio: 1.0,
      rememberLastUsedCamera: true
    };

    try {
      await scanner.start(
        {facingMode: {ideal: "environment"}},
        config,
        onScanSuccess,
        () => {}
      );
      scannerRunning = true;
      setStatus($('scanStatus'), 'الكاميرا تعمل — وجّهها إلى QR الطالب.', 'ok');
    } catch (firstErr) {
      try {
        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || !cameras.length) throw firstErr;

        await scanner.start(
          cameras[0].id,
          config,
          onScanSuccess,
          () => {}
        );
        scannerRunning = true;
        setStatus($('scanStatus'), 'الكاميرا تعمل — وجّهها إلى QR الطالب.', 'ok');
      } catch (err) {
        setStatus(
          $('scanStatus'),
          'تعذر تشغيل الكاميرا. تأكد أن الصفحة مفتوحة من رابط HTTPS على GitHub Pages، ثم اسمح للموقع باستخدام الكاميرا.',
          'err'
        );
        console.error(err);
      }
    }
  }

  async function stopScanner() {
    if (!scanner || !scannerRunning) return;
    try { await scanner.stop(); } catch(e) {}
    try { scanner.clear(); } catch(e) {}
    scannerRunning = false;
    scanner = null;
  }

  async function onScanSuccess(decodedText) {
    if (processing) return;
    processing = true;

    setStatus($('scanStatus'), 'تمت قراءة QR — جاري تسجيل الحضور...', 'warn');

    try {
      const res = await bridgeRequest('bridgeScan', {token: token, qr: decodedText});

      if (res.code === 'AUTH_EXPIRED') {
        throw new Error(res.message || 'انتهت جلسة الدخول.');
      }

      if (res.ok && res.code === 'PRESENT') {
        $('lastResult').textContent =
          '✅ ' + res.student.name + ' — تم تسجيل الحضور';
        $('presentCount').textContent =
          'إجمالي الحاضرين في الجلسة: ' + res.presentCount;
        setStatus(
          $('scanStatus'),
          'تم تسجيل: ' + res.student.name + ' — ' + res.student.id,
          'ok'
        );
      } else if (res.code === 'DUPLICATE') {
        $('lastResult').textContent =
          '⚠️ ' + (res.student?.name || '') + ' — الطالب مسجل بالفعل';
        setStatus($('scanStatus'), 'هذا الطالب مسجل بالفعل في نفس الجلسة.', 'warn');
      } else if (res.code === 'LEVEL_MISMATCH') {
        $('lastResult').textContent =
          '⚠️ ' + (res.student?.name || '') + ' — المستوى غير مطابق';
        setStatus($('scanStatus'), res.message, 'warn');
      } else {
        $('lastResult').textContent = '❌ ' + (res.message || 'لم يتم التسجيل');
        setStatus($('scanStatus'), res.message || 'لم يتم التسجيل', 'err');
      }

    } catch (err) {
      $('lastResult').textContent = '❌ ' + err.message;
      setStatus($('scanStatus'), err.message, 'err');

      if (err.message.includes('انتهت جلسة الدخول')) {
        await logout();
        return;
      }

    } finally {
      // يسمح بقراءة طالب جديد بعد لحظات قليلة
      setTimeout(() => {
        processing = false;
        if (scannerRunning) {
          setStatus($('scanStatus'), 'جاهز لمسح الطالب التالي.', 'ok');
        }
      }, 1100);
    }
  }

  async function logout() {
    await stopScanner();

    if (token) {
      try { await bridgeRequest('bridgeLogout', {token: token}); } catch(e) {}
    }

    token = '';
    $('code').value = '';
    $('scannerCard').classList.add('hidden');
    $('loginCard').classList.remove('hidden');
    setStatus($('loginStatus'), 'تم تسجيل الخروج.', 'ok');
    $('loginStatus').classList.remove('hidden');
  }

  $('loginBtn').addEventListener('click', login);
  $('logoutBtn').addEventListener('click', logout);

  $('code').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  initBridge();
</script>
<iframe id="bridgeFrame" title="bridge" style="display:none"></iframe>
</body>
</html>
